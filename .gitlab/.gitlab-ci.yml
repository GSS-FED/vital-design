stages:
  - test
  - preview
  - build
  - publish
  - registry-validate

# Prefer the MR pipeline so test-job actually runs in the MR widget.
# Without this, jobs that only use `only:`/`except:` (or have no `rules`)
# are omitted from merge_request_event pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Keep develop/main branch pipelines even while a release MR is open,
    # so visual-baseline stays current.
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image: node:22
  interruptible: true
  artifacts:
    expire_in: 1 week
  tags:
    - docker

variables:
  PNPM_VERSION: "10.17.1"
  # Must match the exact playwright version in package.json (Vitest browser
  # mode drives the browsers in this image).
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble
  # Direct-upload Pages project. Override if the name is already taken.
  CLOUDFLARE_PAGES_PROJECT: "vital-design-preview"

# MR pipelines for unprotected branches do not receive protected variables.
# Any target branch, so every MR in a stack gets its preview on its first
# pipeline instead of waiting for GitLab to retarget it to main.
.cloudflare-mr: &cloudflare-mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CLOUDFLARE_API_TOKEN && $CLOUDFLARE_ACCOUNT_ID'

.visual-changes: &visual-changes
  - src-v2/**/*
  - tokens/**/*
  - visual/**/*
  - vite.config.ts
  - .gitlab/.gitlab-ci.yml

# Docs preview: the docs site renders the src-v2 examples, so component,
# registry, and token changes need a preview too.
.docs-changes: &docs-changes
  - apps/docs/**/*
  - src-v2/**/*
  - registry/**/*
  - tokens/**/*
  - .gitlab/.gitlab-ci.yml

before_script:
  - npm i -g pnpm@${PNPM_VERSION}
  - pnpm install --frozen-lockfile

test-job:
  stage: test
  script:
    - pnpm run test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Errors fail the job (unknown classes, raw colors). Warnings (no-restyle,
# require-static-classes) do not: they are design questions that stay open
# until someone decides on code or policy, so the job publishes them as a
# Code Quality report for the MR widget instead.
lint-design-job:
  stage: test
  script:
    - pnpm run lint:design > lint-design.log 2>&1 || status=$?
    - cat lint-design.log
    - pnpm exec oxlint -c .oxlintrc.shadcn.json --disable-nested-config --format gitlab src-v2 apps/docs/components > gl-code-quality-report.json || true
    # "[@shadcn/lint] ..." means the plugin could not read part of the
    # project (e.g. no oxc-parser binding, so wrappers and variants are not
    # followed) and checked less than it should, while still passing.
    - |
      if grep -F '[@shadcn/lint]' lint-design.log; then
        echo "lint:design ran in a degraded mode; fix the setup above."
        exit 1
      fi
    - exit ${status:-0}
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ── Visual regression ─────────────────────────────────────────────────────────
# Vitest browser mode (`visual` project in vite.config.ts). Baselines are not
# committed. Each push to develop/main screenshots every src-v2 story and docs
# example and keeps the images as an artifact; MR pipelines download the
# target branch's baseline (stacked MRs build one from their diff base), list
# results in the MR (JUnit) and attach the Vitest HTML report (Diff /
# Reference / Actual / Slider per failure).

visual-baseline:
  stage: test
  image: ${PLAYWRIGHT_IMAGE}
  script:
    - pnpm run test:visual:update
    - tar -czf vitest-baseline.tgz -C visual __baseline__
  artifacts:
    paths:
      - vitest-baseline.tgz
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

visual-diff:
  stage: test
  image: ${PLAYWRIGHT_IMAGE}
  script:
    # Only develop/main push a baseline. A stacked MR targets a feature
    # branch, which has none, so screenshot the MR's diff base instead: the
    # report then shows this MR's changes, matching its Changes tab.
    - |
      if curl --fail --silent --show-error --location \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --output vitest-baseline.tgz \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}/raw/vitest-baseline.tgz?job=visual-baseline"; then
        tar -xzf vitest-baseline.tgz -C visual
      else
        echo "No vitest-baseline artifact on ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}; building one from ${CI_MERGE_REQUEST_DIFF_BASE_SHA}."
        git fetch --quiet --depth=1 origin "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        git checkout --quiet --force "${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
        pnpm install --frozen-lockfile
        pnpm run test:visual:update
        git checkout --quiet --force "${CI_COMMIT_SHA}"
        pnpm install --frozen-lockfile
      fi
    - pnpm run visual:prepare
    # The HTML reporter always writes to .vitest/; rename it after the run,
    # pass or fail, so the artifact and the Pages upload get a plain folder.
    - pnpm exec vitest run --project visual --reporter=default --reporter=html --reporter=junit --outputFile.junit=visual-junit.xml || status=$?
    - mv .vitest visual-report
    - exit ${status:-0}
  artifacts:
    when: always
    expose_as: Visual diff report
    paths:
      - visual-report/
    reports:
      junit: visual-junit.xml
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *visual-changes

# ── Cloudflare Pages previews ─────────────────────────────────────────────────
# Public docs and visual-diff URLs for an MR. GitLab shows them
# as environments. Jobs stay out of the pipeline until both Cloudflare
# variables exist. Do not mark those variables Protected: feature-branch MR
# pipelines would not receive them. Closing the MR runs the matching stop job.
# Docs uses the Pages branch mr-<iid>-docs. Do not set GITHUB_PAGES here: that flag turns on
# trailingSlash for GitHub Pages, and the preview host is pages.dev.

preview-docs:
  stage: preview
  needs: []
  resource_group: preview-mr-$CI_MERGE_REQUEST_IID-docs
  script:
    - pnpm docs:build
    - node .gitlab/scripts/pages-preview.mjs deploy apps/docs/out "mr-${CI_MERGE_REQUEST_IID}-docs" preview.env DOCS_PREVIEW_URL
  artifacts:
    reports:
      dotenv: preview.env
  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID/docs
    url: $DOCS_PREVIEW_URL
    on_stop: stop-preview-docs
  allow_failure: true
  rules:
    - <<: *cloudflare-mr
      changes: *docs-changes
      when: always

stop-preview-docs:
  stage: preview
  needs: []
  interruptible: false
  before_script: []
  script:
    - node .gitlab/scripts/pages-preview.mjs delete-branch "mr-${CI_MERGE_REQUEST_IID}-docs"
  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID/docs
    action: stop
  allow_failure: true
  rules:
    - <<: *cloudflare-mr
      when: manual

preview-visual-diff:
  stage: preview
  dependencies:
    - visual-diff
  resource_group: preview-mr-$CI_MERGE_REQUEST_IID-visual
  before_script: []
  script:
    - touch preview.env
    - |
      if [ ! -f visual-report/index.html ]; then
        echo "No visual-report/index.html; nothing to publish."
        exit 0
      fi
      node .gitlab/scripts/pages-preview.mjs deploy visual-report "mr-${CI_MERGE_REQUEST_IID}-diff" preview.env VISUAL_DIFF_PREVIEW_URL
  artifacts:
    reports:
      dotenv: preview.env
  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID/visual-diff
    url: $VISUAL_DIFF_PREVIEW_URL
    on_stop: stop-preview-visual-diff
  allow_failure: true
  rules:
    - <<: *cloudflare-mr
      changes: *visual-changes
      when: always

stop-preview-visual-diff:
  stage: preview
  needs: []
  interruptible: false
  before_script: []
  script:
    - node .gitlab/scripts/pages-preview.mjs delete-branch "mr-${CI_MERGE_REQUEST_IID}-diff"
  environment:
    name: preview/mr-$CI_MERGE_REQUEST_IID/visual-diff
    action: stop
  allow_failure: true
  rules:
    - <<: *cloudflare-mr
      when: manual

# Legacy npm (@fed/vital-design from src/). Manual on main — merging to
# main deploys docs, it does not publish. Run build-job then publish-job
# in the GitLab UI if a v1 package release is actually needed.
build-job:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

publish-job:
  stage: publish
  variables:
    HUSKY: 0
    NPM_TOKEN: ${CI_JOB_TOKEN}
  before_script:
    - |
      {
        echo "@fed:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } | tee -a .npmrc
    - npm i -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
  needs:
    - build-job
  dependencies:
    - build-job
  script:
    - pnpm run release
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ── Registry Validate ─────────────────────────────────────────────────────────
# Runs on Merge Requests when the registry, src-v2/ or package.json change.
# A failing job blocks the MR from being merged.

registry-validate-job:
  stage: registry-validate
  before_script:
    - npm i -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
  script:
    - pnpm run registry:validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: &registry-changes
        - registry.json
        - registry/**/*
        - scripts/**/*
        - package.json
        - src-v2/**/*
        - .gitlab/.gitlab-ci.yml

# Installs the registry into a new project with npm's latest versions, so it
# can fail without any change here when a package releases a new major. On MRs
# that is only a warning; the scheduled pipeline on main fails. Keep the other
# main jobs in that pipeline: visual-diff downloads visual-baseline from the
# latest successful main pipeline.
registry-smoke-job:
  stage: registry-validate
  needs: []
  script:
    - pnpm run registry:smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *registry-changes
      allow_failure: true
