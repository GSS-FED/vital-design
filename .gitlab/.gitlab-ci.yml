stages:
  - test
  - build
  - publish
  - registry-validate

default:
  image: node:20
  interruptible: true
  artifacts:
    expire_in: 1 week
  tags:
    - docker

variables:
  PNPM_VERSION: "10.17.1"

before_script:
  - npm i -g pnpm@${PNPM_VERSION}
  - pnpm install --frozen-lockfile

test-job:
  stage: test
  script:
    - pnpm run test

build-job:
  stage: build
  script:
    - pnpm run build
  artifacts:
    paths:
      - dist/
  only:
    - main

publish-job:
  stage: publish
  variables:
    HUSKY: 0
    NPM_TOKEN: ${CI_JOB_TOKEN}
  before_script:
    - |
      {
        echo "@fed:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "${CI_API_V4_URL#https?}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } | tee -a .npmrc
    - npm i -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
  dependencies:
    - build-job
  script:
    - pnpm run release
  only:
    - main

# ── Registry Validate ─────────────────────────────────────────────────────────
# Runs on Merge Requests when registry.json or src-v2/ files change.
# A failing job blocks the MR from being merged.

registry-validate-job:
  stage: registry-validate
  before_script:
    - npm i -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile
  script:
    - pnpm run registry:validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - registry.json
        - src-v2/**/*
        - .gitlab/.gitlab-ci.yml
